name: Build Advanced PTP 1.20.1

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Extract project ZIP
        run: unzip -q advanced-ptp-1.20.1-github-build.zip

      - name: Build mod
        working-directory: advanced-ptp
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: advanced-ptp-1.20.1
          path: advanced-ptp/build/libs/advanced-ptp-1.0.0.jar
          if-no-files-found: error
          
